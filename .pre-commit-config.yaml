---
# Run with prek (drop-in pre-commit replacement): uv run prek run --all-files
# Install git hooks: uv run prek install
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
# Byte-exact upstream test fixtures must stay verbatim
exclude: ^tests/data/
repos:
  # File hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=256]
      - id: fix-byte-order-marker

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--wrap, '100', --number]
        additional_dependencies: [mdformat-gfm]

  # GitHub Actions security audit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  # Keep uv.lock in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.4
    hooks:
      - id: uv-lock

  # Local hooks using the locked project tools
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff linting (incl. security and complexity rules)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest
        name: Tests with coverage
        entry: uv run pytest -q
        language: system
        types: [python]
        stages: [pre-push]
        pass_filenames: false
